<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AutoContinua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" />
  <style>
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body { font-family: sans-serif; width: 420px; padding: 12px; margin: 0; }
    h3 { margin: 0 0 12px 0; display: flex; align-items: center; gap: 6px; font-size: 18px; }
    .button-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 12px 10px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 14px;
      white-space: nowrap;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f8f8f8;
    }
    button:hover {
      background: #e8e8e8;
    }
    #start { background: #e8f5e9; border-color: #4caf50; }
    #start:hover { background: #c8e6c9; }
    #stop { background: #ffebee; border-color: #f44336; }
    #stop:hover { background: #ffcdd2; }
    #guide { width: 100%; margin-top: 0; }
    #status { margin: 12px 0; font-size: 13px; display: flex; align-items: center; gap: 4px; padding: 8px; background: #f0f8ff; border-radius: 8px; }
    #log {
      height: 180px;
      overflow-y: auto;
      font-size: 11px;
      background: #f5f5f5;
      padding: 8px;
      white-space: pre-wrap;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      font-size: 20px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <h3><span class="material-symbols-rounded">smart_toy</span> AutoContinua</h3>
  <div class="button-col">
    <button id="start"><span class="material-symbols-rounded">play_arrow</span> Avvia (CTRL+SHIFT+ALT+P)</button>
    <button id="stop"><span class="material-symbols-rounded">stop</span> Ferma (CTRL+SHIFT+ALT+S)</button>
  </div>
  <button id="guide"><span class="material-symbols-rounded">menu_book</span> Apri guida</button>
  <div id="status"><span class="material-symbols-rounded">info</span> Stato: <span id="statusText">fermo</span></div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
