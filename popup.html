<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AutoContinua</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0" />
  <style>
    body { font-family: sans-serif; width: 300px; padding: 10px; }
    h3 { margin: 0 0 8px 0; display: flex; align-items: center; gap: 6px; }
    button {
      width: 48%; padding: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    }
    #start { margin-right: 4%; }
    #guide { width: 100%; margin-top: 4px; }
    #status { margin: 8px 0; font-size: 12px; display: flex; align-items: center; gap: 4px; }
    #log {
      height: 160px;
      overflow-y: auto;
      font-size: 11px;
      background: #f5f5f5;
      padding: 6px;
      white-space: pre-wrap;
      border: 1px solid #ddd;
    }
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      font-size: 18px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <h3><span class="material-symbols-rounded">smart_toy</span> AutoContinua</h3>
  <button id="start"><span class="material-symbols-rounded">play_arrow</span> Avvia (ALT+P)</button>
  <button id="stop"><span class="material-symbols-rounded">stop</span> Ferma (ALT+S)</button>
  <button id="guide"><span class="material-symbols-rounded">menu_book</span> Apri guida</button>
  <div id="status"><span class="material-symbols-rounded">info</span> Stato: <span id="statusText">fermo</span></div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
