name: Auto Build Zip and Release

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
      - '**/*.js'
      - '**/*.html'
      - '**/*.css'
      - 'icons/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          set -euo pipefail

          if ! jq empty manifest.json; then
            echo "::error::manifest.json non è un JSON valido."
            exit 1
          fi

          MV=$(jq -r '.manifest_version' manifest.json)

          if [ "$MV" != "3" ]; then
            echo "::warning::manifest_version è $MV, atteso 3."
          fi

      - name: Read version from manifest.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version extracted: $VERSION"

      - name: Create cross-browser Zip Package
        run: |
          set -euo pipefail

          # File essenziali per il funzionamento dell'estensione.
          # Lo step fallisce se anche uno solo manca.
          REQUIRED_FILES=(
            manifest.json
            background.js
            content.js
            popup.html
            popup.js
          )

          # Directory essenziali.
          REQUIRED_DIRS=(
            icons
          )

          # File accessori: inclusi se presenti,
          # ma non bloccanti se mancanti.
          OPTIONAL_FILES=(
            guida.html
            LICENSE
            README.md
          )

          mkdir -p release_temp

          # Copia dei file obbligatori
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::File richiesto mancante: $f"
              exit 1
            fi

            cp "$f" release_temp/
          done

          # Copia delle directory obbligatorie
          for d in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$d" ]; then
              echo "::error::Directory richiesta mancante: $d"
              exit 1
            fi

            cp -R "$d" release_temp/
          done

          # File opzionali
          for f in "${OPTIONAL_FILES[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" release_temp/
            else
              echo "::notice::File opzionale assente, saltato: $f"
            fi
          done

          # Mostra il contenuto che verrà inserito nello ZIP
          echo "Contenuto del pacchetto:"
          find release_temp -type f | sort

          # Un solo zip, valido sia per Chrome sia per Firefox.
          #
          # I file vengono zippati stando DENTRO release_temp,
          # così manifest.json rimane nella radice dello ZIP.
          cd release_temp
          zip -r "../AutoContinua-v${VERSION}.zip" .
          cd ..

          rm -rf release_temp

      - name: Verify manifest.json is at the zip root
        run: |
          set -euo pipefail

          TOP_LEVEL_MANIFEST=$(unzip -l "AutoContinua-v${VERSION}.zip" \
            | awk '{print $4}' \
            | grep -x "manifest.json" || true)

          if [ -z "$TOP_LEVEL_MANIFEST" ]; then
            echo "::error::manifest.json non è in radice nello zip: Firefox non riuscirà a caricare l'estensione."
            unzip -l "AutoContinua-v${VERSION}.zip"
            exit 1
          fi

          echo "OK: manifest.json è in radice."

      - name: Verify icons are in the zip
        run: |
          set -euo pipefail

          if ! unzip -l "AutoContinua-v${VERSION}.zip" \
            | awk '{print $4}' \
            | grep -q '^icons/'; then

            echo "::error::La directory icons/ non è presente nello ZIP."
            unzip -l "AutoContinua-v${VERSION}.zip"
            exit 1
          fi

          echo "OK: directory icons/ presente nello ZIP."

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Release v${{ env.VERSION }}"
          body: |
            Aggiornamento automatico estensione versione ${{ env.VERSION }}.

            Un unico file .zip, compatibile sia con **Chrome** che con **Firefox**:

            - Chrome: `chrome://extensions` → Modalità sviluppatore → "Carica estensione non pacchettizzata" (estrarre lo zip e selezionare la cartella).
            - Firefox: `about:debugging#/runtime/this-firefox` → "Carica un componente aggiuntivo temporaneo" (estrarre lo zip e selezionare `manifest.json`). Per installazione permanente su Firefox stabile è necessaria la firma su addons.mozilla.org.

            La directory `icons/` e tutte le icone contenute vengono incluse automaticamente nel pacchetto.
          files: "AutoContinua-v${{ env.VERSION }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
