name: Auto Build Zip and Release

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
      - '**/*.js'
      - '**/*.html'
      - '**/*.css'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          set -euo pipefail
          if ! jq empty manifest.json; then
            echo "::error::manifest.json non è un JSON valido."
            exit 1
          fi
          MV=$(jq -r '.manifest_version' manifest.json)
          if [ "$MV" != "3" ]; then
            echo "::warning::manifest_version è $MV, atteso 3."
          fi

      - name: Read version from manifest.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version extracted: $VERSION"

      - name: Create cross-browser Zip Package
        run: |
          set -euo pipefail

          # File essenziali per il funzionamento dell'estensione (obbligatori:
          # lo step fallisce se anche uno solo manca).
          REQUIRED_FILES=(
            manifest.json
            background.js
            content.js
            popup.html
            popup.js
          )

          # File accessori: inclusi se presenti, ma non bloccanti se mancano.
          OPTIONAL_FILES=(
            guida.html
            LICENSE
            README.md
          )

          mkdir -p release_temp

          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::File richiesto mancante: $f"
              exit 1
            fi
            cp "$f" release_temp/
          done

          for f in "${OPTIONAL_FILES[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" release_temp/
            else
              echo "::notice::File opzionale assente, saltato: $f"
            fi
          done

          # Un solo zip, valido sia per Chrome (chrome://extensions) sia per
          # Firefox (about:debugging / AMO): il manifest.json dichiara
          # background.service_worker (Chrome) e background.scripts (Firefox),
          # più browser_specific_settings.gecko per Firefox.
          # I file vanno zippati stando DENTRO release_temp, così manifest.json
          # finisce in radice nello zip (requisito di Firefox).
          cd release_temp
          zip -r "../AutoContinua-v${VERSION}.zip" .
          cd ..
          rm -rf release_temp

      - name: Verify manifest.json is at the zip root
        run: |
          set -euo pipefail
          TOP_LEVEL_MANIFEST=$(unzip -l "AutoContinua-v${VERSION}.zip" | awk '{print $4}' | grep -x "manifest.json" || true)
          if [ -z "$TOP_LEVEL_MANIFEST" ]; then
            echo "::error::manifest.json non è in radice nello zip: Firefox non riuscirà a caricare l'estensione."
            unzip -l "AutoContinua-v${VERSION}.zip"
            exit 1
          fi
          echo "OK: manifest.json è in radice."

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Release v${{ env.VERSION }}"
          body: |
            Aggiornamento automatico estensione versione ${{ env.VERSION }}.

            Un unico file .zip, compatibile sia con **Chrome** che con **Firefox**:
            - Chrome: `chrome://extensions` → Modalità sviluppatore → "Carica estensione non pacchettizzata" (estrarre lo zip e selezionare la cartella).
            - Firefox: `about:debugging#/runtime/this-firefox` → "Carica un componente aggiuntivo temporaneo" (estrarre lo zip e selezionare `manifest.json`). Per installazione permanente su Firefox stabile è necessaria la firma su addons.mozilla.org.
          files: "AutoContinua-v${{ env.VERSION }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}